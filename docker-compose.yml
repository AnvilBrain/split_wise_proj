services:
  postgres:
    image: postgres:16
    container_name: split_postgres
    environment:
      POSTGRES_USER: split_user
      POSTGRES_PASSWORD: split_pass
      POSTGRES_DB: split_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: split_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
